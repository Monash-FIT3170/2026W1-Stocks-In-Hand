name: Execute approved staging change set

on:
  workflow_dispatch:
    inputs:
      change_set_arn:
        description: Change-set ARN approved by Person 1
        required: true
        type: string
      approval_reference:
        description: Person 1 approval reference
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: stocks-in-hand-staging-execute
  cancel-in-progress: false

jobs:
  execute:
    name: Person 2 executes reviewed change set
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ap-southeast-2
      STACK_NAME: stocks-in-hand-staging

    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: stocks-in-hand-execute

      - name: Verify the approved change set
        id: verify
        shell: bash
        env:
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
        run: |
          EXECUTION_STATUS="$(aws cloudformation describe-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_NAME" \
            --query ExecutionStatus \
            --output text)"
          if [ "$EXECUTION_STATUS" != "AVAILABLE" ]; then
            echo "Change set is not available: $EXECUTION_STATUS" >&2
            exit 1
          fi
          STACK_STATUS="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text)"
          if [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "waiter=stack-create-complete" >> "$GITHUB_OUTPUT"
          else
            echo "waiter=stack-update-complete" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture the previous release for potential rollback
        id: previous_release
        if: steps.verify.outputs.waiter == 'stack-update-complete'
        shell: bash
        run: |
          PREVIOUS_API_IMAGE="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Parameters[?ParameterKey=='ApiImageUri'].ParameterValue" \
            --output text)"
          if [ -z "$PREVIOUS_API_IMAGE" ] || [ "$PREVIOUS_API_IMAGE" = "None" ]; then
            echo "ApiImageUri parameter is missing from the current stack" >&2
            exit 1
          fi
          PREVIOUS_RELEASE_SHA="${PREVIOUS_API_IMAGE##*:}"
          if ! [[ "$PREVIOUS_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not parse a 40-character SHA from $PREVIOUS_API_IMAGE" >&2
            exit 1
          fi
          echo "release_sha=$PREVIOUS_RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Execute the approved change set
        shell: bash
        env:
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
        run: |
          aws cloudformation execute-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_NAME"

      - name: Wait for CloudFormation
        shell: bash
        run: |
          aws cloudformation wait "${{ steps.verify.outputs.waiter }}" \
            --stack-name "$STACK_NAME"

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install health check dependencies
        shell: bash
        run: pip install --disable-pip-version-check httpx

      - name: Resolve the API endpoint
        id: api
        shell: bash
        run: |
          API_ENDPOINT="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)"
          if [ -z "$API_ENDPOINT" ] || [ "$API_ENDPOINT" = "None" ]; then
            echo "ApiEndpoint stack output is missing" >&2
            exit 1
          fi
          echo "api_endpoint=$API_ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Wait for the deployed API to report healthy
        shell: bash
        run: |
          python backend/scripts/wait_for_health.py \
            --url "${{ steps.api.outputs.api_endpoint }}/health"

      - name: Record deployment outputs
        shell: bash
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output table
          {
            echo "### Approved staging change set executed"
            echo ""
            echo "Approval: ${{ inputs.approval_reference }}"
            echo ""
            echo "Change set: \`${{ inputs.change_set_arn }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
