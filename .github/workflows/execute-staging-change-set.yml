name: Execute approved staging change set

on:
  workflow_dispatch:
    inputs:
      change_set_arn:
        description: Change-set ARN approved by Person 1
        required: true
        type: string
      approval_reference:
        description: Person 1 approval reference
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: stocks-in-hand-staging-execute
  cancel-in-progress: false

jobs:
  execute:
    name: Person 2 executes reviewed change set
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ap-southeast-2
      STACK_NAME: stocks-in-hand-staging

    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: stocks-in-hand-execute

      - name: Verify the approved change set
        id: verify
        shell: bash
        env:
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
        run: |
          EXECUTION_STATUS="$(aws cloudformation describe-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_NAME" \
            --query ExecutionStatus \
            --output text)"
          if [ "$EXECUTION_STATUS" != "AVAILABLE" ]; then
            echo "Change set is not available: $EXECUTION_STATUS" >&2
            exit 1
          fi
          STACK_STATUS="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text)"
          if [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "waiter=stack-create-complete" >> "$GITHUB_OUTPUT"
          else
            echo "waiter=stack-update-complete" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install health check and release module dependencies
        shell: bash
        run: pip install --disable-pip-version-check httpx PyYAML==6.0.3

      - name: Capture the previous release for potential rollback
        id: previous_release
        if: steps.verify.outputs.waiter == 'stack-update-complete'
        working-directory: backend
        shell: bash
        run: |
          python -m tools.release previous-release \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"

      - name: Execute the approved change set
        shell: bash
        env:
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
        run: |
          aws cloudformation execute-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_NAME"

      - name: Wait for CloudFormation
        shell: bash
        run: |
          aws cloudformation wait "${{ steps.verify.outputs.waiter }}" \
            --stack-name "$STACK_NAME"

      - name: Resolve the API endpoint
        working-directory: backend
        shell: bash
        run: |
          python -m tools.release outputs --github-env \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            ApiEndpoint=API_ENDPOINT

      - name: Wait for the deployed API to report healthy
        shell: bash
        run: |
          python backend/scripts/wait_for_health.py \
            --url "$API_ENDPOINT/health"

      - name: Record deployment outputs
        shell: bash
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output table
          {
            echo "### Approved staging change set executed"
            echo ""
            echo "Approval: ${{ inputs.approval_reference }}"
            echo ""
            echo "Change set: \`${{ inputs.change_set_arn }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare an automatic rollback after a failed health check
        if: failure() && steps.previous_release.outputs.previous_release_sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RELEASE_SHA: ${{ steps.previous_release.outputs.previous_release_sha }}
        run: |
          if gh workflow run prepare-staging-backend-rollback.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f release_sha="$PREVIOUS_RELEASE_SHA" \
            -f compatibility_reference="auto-triggered: health check failed on $GITHUB_SHA"; then
            {
              echo "### Automatic rollback preparation triggered"
              echo ""
              echo "This deploy failed its post-deploy health check. A rollback"
              echo "change set targeting \`$PREVIOUS_RELEASE_SHA\`"
              echo "is being prepared and still requires Person 1 review and"
              echo "Person 2 execution before anything changes."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not automatically start the rollback workflow - the pipeline's GitHub token does not have permission to trigger another workflow run."
            {
              echo "### Automatic rollback trigger unavailable"
              echo ""
              echo "This deploy failed its post-deploy health check, but the"
              echo "pipeline could not automatically start"
              echo "\`prepare-staging-backend-rollback.yml\` (insufficient"
              echo "GitHub Actions permissions on the pipeline's token)."
              echo ""
              echo "**Run it manually**, using these inputs:"
              echo ""
              echo "- \`release_sha\`: \`$PREVIOUS_RELEASE_SHA\`"
              echo "- \`compatibility_reference\`: your own confirmation that the"
              echo "  previous release is compatible with the current database"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
