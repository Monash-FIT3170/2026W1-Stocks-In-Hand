name: Verify staging queue wiring

# CD integration test for the SQS queue pipeline. Run this manually after
# "Execute approved staging change set" to confirm every queue, dead-letter
# queue, consumer, alarm, stack output and queue setting in the *deployed*
# stack reconciles with what the template declares. The list of things to
# check comes from the template model (backend/tools/template_model.py), so
# a queue added to the template is checked without editing this workflow.
#
# Strictly read-only: it calls cloudformation:ListStackResources,
# cloudformation:DescribeStacks and sqs:GetQueueAttributes, which
# stocks-in-hand-github-staging (the role behind AWS_DEPLOY_ROLE_ARN)
# already has. It never creates, updates, deletes, or sends anything.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: stocks-in-hand-staging-verify-queues
  cancel-in-progress: false

jobs:
  verify:
    name: Reconcile deployed queue pipeline against the template
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ap-southeast-2
      STACK_NAME: stocks-in-hand-staging

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        shell: bash
        # The template model needs only PyYAML, not the backend dependencies.
        run: pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: stocks-in-hand-verify-queues

      - name: Reconcile the deployed queue pipeline with the template
        shell: bash
        working-directory: backend
        run: python -m tools.verify_queue_wiring --stack-name "$STACK_NAME"
