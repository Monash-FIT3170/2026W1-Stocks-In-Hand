name: Deploy staging release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      auth_provider:
        description: Backend authentication provider for this change set
        required: true
        default: legacy
        type: choice
        options:
          - legacy
          - dual
          - cognito
      enable_schedule:
        description: Enable the weekly scrape in the reviewed change set
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      enable_public_discussion_schedule:
        description: Enable bounded weekday public discussion collection
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      enable_marketaux:
        description: Enable Marketaux API access and weekly news collection
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      enable_analysis:
        description: Allow Queue C to start analysis work
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"
      enable_notifications:
        description: Enable user-facing Brevo watchlist alerts
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      enable_bedrock:
        description: Grant API and analysis access to Bedrock GPT-OSS 120B
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      scheduled_tickers:
        description: Comma-separated tickers for the weekly schedule
        required: true
        default: "ANZ,BHP,CBA,CSL,WES"
        type: string
      scheduled_public_discussion_sources:
        description: Comma-separated public sources to collect
        required: true
        default: "bluesky,mastodon"
        type: string
      public_discussion_per_source_limit:
        description: Maximum items collected from each public source
        required: true
        default: "10"
        type: string
      marketaux_per_ticker_limit:
        description: Maximum Marketaux articles collected for each ticker
        required: true
        default: "10"
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: stocks-in-hand-staging-deploy
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate, build, and deploy
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ap-southeast-2
      STACK_NAME: stocks-in-hand-staging
      PARAMETER_PATH_PREFIX: /stocks-in-hand/staging
      RELEASE_SHA: ${{ github.sha }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stocks_in_hand_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stocks_in_hand_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stocks_in_hand_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-api.txt
            backend/requirements-testing.txt

      - name: Install backend test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            -r backend/requirements-api.txt \
            -r backend/requirements-testing.txt \
            pypdf==6.14.2 \
            defusedxml==0.7.1 \
            playwright==1.61.0

      - name: Reproduce and repair the deployed schema drift
        working-directory: backend
        shell: bash
        run: |
          python -c "from sqlalchemy import create_engine, text; import os; engine=create_engine(os.environ['DATABASE_URL'], isolation_level='AUTOCOMMIT'); connection=engine.connect(); connection.execute(text('CREATE ROLE anon NOLOGIN')); connection.execute(text('CREATE ROLE authenticated NOLOGIN')); connection.close(); engine.dispose()"
          alembic upgrade 86d2cognitoidentity
          python -c "from sqlalchemy import create_engine, text; import os; engine=create_engine(os.environ['DATABASE_URL']); connection=engine.connect(); connection.execute(text('ALTER TABLE artifacts DROP COLUMN is_duplicate')); connection.commit(); connection.close(); engine.dispose()"
          alembic upgrade head

      - name: Run backend tests and security checks
        shell: bash
        run: |
          python -m pytest -q backend/tests
          python -m bandit -q -r backend/app backend/main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend tests and production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_AUTH_PROVIDER: legacy
        run: |
          npm ci
          npm test
          npm run build

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: stocks-in-hand-deploy

      - name: Plan the release
        id: release
        working-directory: backend
        shell: bash
        env:
          OPERATIONS_EMAIL: ${{ vars.OPERATIONS_EMAIL }}
          ALERT_SENDER_EMAIL: ${{ vars.ALERT_SENDER_EMAIL }}
          SITE_DOMAIN_NAME: ${{ vars.SITE_DOMAIN_NAME }}
          SITE_CERTIFICATE_ARN: ${{ vars.SITE_CERTIFICATE_ARN }}
          SITE_HOSTED_ZONE_ID: ${{ vars.SITE_HOSTED_ZONE_ID }}
          # A manual run's choice wins. A push has no inputs, so the
          # AUTO_DEPLOY_* variable applies when it is set, then the live
          # stack's value, then the template default.
          AUTH_PROVIDER: ${{ inputs.auth_provider || vars.AUTO_DEPLOY_AUTH_PROVIDER }}
          ENABLE_SCHEDULE: ${{ inputs.enable_schedule || vars.AUTO_DEPLOY_ENABLE_SCHEDULE }}
          ENABLE_PUBLIC_DISCUSSION_SCHEDULE: ${{ inputs.enable_public_discussion_schedule || vars.AUTO_DEPLOY_ENABLE_PUBLIC_DISCUSSION_SCHEDULE }}
          ENABLE_MARKETAUX: ${{ inputs.enable_marketaux || vars.AUTO_DEPLOY_ENABLE_MARKETAUX }}
          ENABLE_ANALYSIS: ${{ inputs.enable_analysis || vars.AUTO_DEPLOY_ENABLE_ANALYSIS }}
          ENABLE_NOTIFICATIONS: ${{ inputs.enable_notifications || vars.AUTO_DEPLOY_ENABLE_NOTIFICATIONS }}
          ENABLE_BEDROCK: ${{ inputs.enable_bedrock || vars.AUTO_DEPLOY_ENABLE_BEDROCK }}
          SCHEDULED_TICKERS: ${{ inputs.scheduled_tickers || vars.AUTO_DEPLOY_SCHEDULED_TICKERS }}
          SCHEDULED_PUBLIC_DISCUSSION_SOURCES: ${{ inputs.scheduled_public_discussion_sources || vars.AUTO_DEPLOY_SCHEDULED_PUBLIC_DISCUSSION_SOURCES }}
          PUBLIC_DISCUSSION_PER_SOURCE_LIMIT: ${{ inputs.public_discussion_per_source_limit || vars.AUTO_DEPLOY_PUBLIC_DISCUSSION_PER_SOURCE_LIMIT }}
          MARKETAUX_PER_TICKER_LIMIT: ${{ inputs.marketaux_per_ticker_limit || vars.AUTO_DEPLOY_MARKETAUX_PER_TICKER_LIMIT }}
          # A manual run only creates a change set for Person 1 to review.
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && '--no-execute' || '--execute' }}
        # The plan checks every value against the template's constraints and
        # rules, and checks the Brevo and Marketaux secrets when their switch
        # is on, before any image is built.
        run: |
          python -m tools.release plan "$DEPLOY_MODE" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --release-sha "$RELEASE_SHA" \
            --set Environment=staging \
            --set "ParameterPathPrefix=$PARAMETER_PATH_PREFIX" \
            --set "OperationsEmail=$OPERATIONS_EMAIL" \
            --set "AlertSenderEmail=$ALERT_SENDER_EMAIL" \
            --set "SiteDomainName=$SITE_DOMAIN_NAME" \
            --set "SiteCertificateArn=$SITE_CERTIFICATE_ARN" \
            --set "SiteHostedZoneId=$SITE_HOSTED_ZONE_ID" \
            --set-unless-empty "AuthProvider=$AUTH_PROVIDER" \
            --set-unless-empty "ScheduleEnabled=$ENABLE_SCHEDULE" \
            --set-unless-empty "PublicDiscussionScheduleEnabled=$ENABLE_PUBLIC_DISCUSSION_SCHEDULE" \
            --set-unless-empty "MarketauxEnabled=$ENABLE_MARKETAUX" \
            --set-unless-empty "AnalysisEnabled=$ENABLE_ANALYSIS" \
            --set-unless-empty "NotificationsEnabled=$ENABLE_NOTIFICATIONS" \
            --set-unless-empty "BedrockEnabled=$ENABLE_BEDROCK" \
            --set-unless-empty "ScheduledTickers=$SCHEDULED_TICKERS" \
            --set-unless-empty "ScheduledPublicDiscussionSources=$SCHEDULED_PUBLIC_DISCUSSION_SOURCES" \
            --set-unless-empty "PublicDiscussionPerSourceLimit=$PUBLIC_DISCUSSION_PER_SOURCE_LIMIT" \
            --set-unless-empty "MarketauxPerTickerLimit=$MARKETAUX_PER_TICKER_LIMIT" \
            --out "$RUNNER_TEMP/release-plan.json"

      - name: Detect existing immutable release images
        id: image_state
        shell: bash
        run: |
          for image in api scraper analysis; do
            if aws ecr describe-images \
              --repository-name "stocks-in-hand-$image" \
              --image-ids "imageTag=$RELEASE_SHA" >/dev/null 2>&1; then
              echo "${image}_exists=true" >> "$GITHUB_OUTPUT"
              echo "Reusing existing immutable $image image for $RELEASE_SHA"
            else
              echo "${image}_exists=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to ECR
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.release.outputs.registry }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push API image
        if: steps.image_state.outputs.api_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.api
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.release.outputs.registry }}/stocks-in-hand-api:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push scraper image
        if: steps.image_state.outputs.scraper_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.scraper
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.release.outputs.registry }}/stocks-in-hand-scraper:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=scraper
          cache-to: type=gha,mode=max,scope=scraper

      - name: Build and push analysis image
        if: steps.image_state.outputs.analysis_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.analysis
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.release.outputs.registry }}/stocks-in-hand-analysis:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=analysis
          cache-to: type=gha,mode=max,scope=analysis

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate the SAM template
        shell: bash
        run: sam validate --lint --template-file infra/template.yaml

      - name: Create or execute the SAM change set
        working-directory: backend
        shell: bash
        # Checks that the release images exist, then runs the planned sam deploy.
        run: python -m tools.release apply "$RUNNER_TEMP/release-plan.json"

      - name: Export the change set for Person 1 review
        id: change_set
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          CHANGE_SET_ARN="$(aws cloudformation list-change-sets \
            --stack-name "$STACK_NAME" \
            --query "reverse(sort_by(Summaries[?Status=='CREATE_COMPLETE'], &CreationTime))[0].ChangeSetId" \
            --output text)"
          if [ -z "$CHANGE_SET_ARN" ] || [ "$CHANGE_SET_ARN" = "None" ]; then
            echo "No reviewable change set was created" >&2
            exit 1
          fi
          aws cloudformation describe-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_NAME" \
            --output json > change-set.json
          echo "change_set_arn=$CHANGE_SET_ARN" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging change set awaiting Person 1 review"
            echo ""
            echo "Release SHA: \`$RELEASE_SHA\`"
            echo ""
            echo "Change set: \`$CHANGE_SET_ARN\`"
            echo ""
            echo "Person 2 must not execute this change set until Person 1 approves it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the change-set evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: staging-change-set-${{ env.RELEASE_SHA }}
          path: change-set.json
          if-no-files-found: error
          retention-days: 14

      - name: Resolve deployed endpoints and frontend configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: backend
        shell: bash
        run: |
          python -m tools.release outputs --github-env \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            ApiEndpoint=API_ENDPOINT \
            AuthProvider=NEXT_PUBLIC_AUTH_PROVIDER \
            CognitoUserPoolId=NEXT_PUBLIC_COGNITO_USER_POOL_ID \
            CognitoUserPoolClientId=NEXT_PUBLIC_COGNITO_APP_CLIENT_ID \
            FrontendBucketName=FRONTEND_BUCKET \
            FrontendDistributionId=DISTRIBUTION_ID
          echo "NEXT_PUBLIC_AWS_REGION=$AWS_REGION" >> "$GITHUB_ENV"

      - name: Wait for the automatically deployed API to report healthy
        id: health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python backend/scripts/wait_for_health.py \
            --url "$API_ENDPOINT/health"

      - name: Prepare rollback after an automatic health-check failure
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          failure() &&
          steps.health.outcome == 'failure' &&
          steps.release.outputs.previous_release_sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RELEASE_SHA: ${{ steps.release.outputs.previous_release_sha }}
        run: |
          gh workflow run prepare-staging-backend-rollback.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_sha="$PREVIOUS_RELEASE_SHA" \
            -f compatibility_reference="auto-triggered: health check failed on $GITHUB_SHA"
          {
            echo "### Automatic rollback preparation triggered"
            echo ""
            echo "The API health check failed. A reviewed rollback change set"
            echo "is being prepared for \`$PREVIOUS_RELEASE_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the deployed frontend configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
        run: |
          npm run build
          test -f out/index.html

      - name: Package the automatic frontend rollback artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          tar -czf "frontend-$RELEASE_SHA.tar.gz" -C frontend/out .
          sha256sum "frontend-$RELEASE_SHA.tar.gz" > "frontend-$RELEASE_SHA.sha256"

      - name: Upload the automatic frontend rollback artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ env.RELEASE_SHA }}
          path: |
            frontend-${{ env.RELEASE_SHA }}.tar.gz
            frontend-${{ env.RELEASE_SHA }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Preserve the automatic frontend release snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          aws s3 sync frontend/out \
            "s3://$FRONTEND_BUCKET/_releases/$RELEASE_SHA" \
            --cache-control "no-cache"
          aws s3 sync frontend/out/_next/static \
            "s3://$FRONTEND_BUCKET/_releases/$RELEASE_SHA/_next/static" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Publish the automatic frontend release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          aws s3 sync frontend/out "s3://$FRONTEND_BUCKET" \
            --delete \
            --exclude "_releases/*" \
            --cache-control "no-cache"
          aws s3 sync frontend/out/_next/static \
            "s3://$FRONTEND_BUCKET/_next/static" \
            --cache-control "public,max-age=31536000,immutable"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
          {
            echo "### Main deployed automatically to staging"
            echo ""
            echo "Release SHA: \`$RELEASE_SHA\`"
            echo ""
            echo "API health check passed and the CloudFront invalidation started."
          } >> "$GITHUB_STEP_SUMMARY"
