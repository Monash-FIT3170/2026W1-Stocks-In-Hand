name: Publish staging frontend

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git SHA approved for the frontend release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: stocks-in-hand-staging-frontend
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish static frontend
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ap-southeast-2
      STACK_NAME: stocks-in-hand-staging

    steps:
      - name: Validate the release SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi

      - name: Check out the approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: stocks-in-hand-frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the static frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
        run: |
          npm ci
          npm run build
          test -f out/index.html

      - name: Package the rollback artifact
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          tar -czf "frontend-$RELEASE_SHA.tar.gz" -C frontend/out .
          sha256sum "frontend-$RELEASE_SHA.tar.gz" > "frontend-$RELEASE_SHA.sha256"

      - name: Upload the rollback artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ inputs.release_sha }}
          path: |
            frontend-${{ inputs.release_sha }}.tar.gz
            frontend-${{ inputs.release_sha }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Resolve frontend resources
        shell: bash
        run: |
          FRONTEND_BUCKET="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)"
          DISTRIBUTION_ID="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" \
            --output text)"
          {
            echo "FRONTEND_BUCKET=$FRONTEND_BUCKET"
            echo "DISTRIBUTION_ID=$DISTRIBUTION_ID"
          } >> "$GITHUB_ENV"

      - name: Preserve the release snapshot
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          aws s3 sync frontend/out \
            "s3://$FRONTEND_BUCKET/_releases/$RELEASE_SHA" \
            --cache-control "no-cache"
          aws s3 sync frontend/out/_next/static \
            "s3://$FRONTEND_BUCKET/_releases/$RELEASE_SHA/_next/static" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Publish the active frontend
        shell: bash
        run: |
          aws s3 sync frontend/out "s3://$FRONTEND_BUCKET" \
            --delete \
            --exclude "_releases/*" \
            --cache-control "no-cache"
          aws s3 sync frontend/out/_next/static \
            "s3://$FRONTEND_BUCKET/_next/static" \
            --cache-control "public,max-age=31536000,immutable"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
