name: Publish staging frontend

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git SHA of the approved frontend candidate
        required: true
        type: string
      auth_provider:
        description: Authentication mode of the approved candidate
        required: true
        type: choice
        options:
          - legacy
          - cognito
      approval_reference:
        description: Review reference for this candidate and cutover
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: stocks-in-hand-staging-frontend
  cancel-in-progress: false

jobs:
  publish:
    name: Publish approved static frontend candidate
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ap-southeast-2
      STACK_NAME: stocks-in-hand-staging
      RELEASE_SHA: ${{ inputs.release_sha }}
      AUTH_PROVIDER: ${{ inputs.auth_provider }}

    steps:
      - name: Validate the release inputs
        shell: bash
        run: |
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: stocks-in-hand-frontend-publish

      - name: Verify the stack and approved candidate
        shell: bash
        run: |
          FRONTEND_BUCKET="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)"
          DISTRIBUTION_ID="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" \
            --output text)"
          STACK_AUTH_PROVIDER="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthProvider'].OutputValue" \
            --output text)"
          for value in "$FRONTEND_BUCKET" "$DISTRIBUTION_ID" "$STACK_AUTH_PROVIDER"; do
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "The staging stack is missing a required frontend output" >&2
              exit 1
            fi
          done
          if [ "$STACK_AUTH_PROVIDER" != "$AUTH_PROVIDER" ] \
            && [ "$STACK_AUTH_PROVIDER" != "dual" ]; then
            echo "Backend mode is $STACK_AUTH_PROVIDER, candidate mode is $AUTH_PROVIDER" >&2
            exit 1
          fi
          if ! aws s3api head-object \
            --bucket "$FRONTEND_BUCKET" \
            --key "_candidates/$RELEASE_SHA/$AUTH_PROVIDER/_READY" >/dev/null; then
            echo "The approved frontend candidate does not exist" >&2
            exit 1
          fi
          {
            echo "FRONTEND_BUCKET=$FRONTEND_BUCKET"
            echo "DISTRIBUTION_ID=$DISTRIBUTION_ID"
          } >> "$GITHUB_ENV"

      - name: Preserve the mode-specific release snapshot
        shell: bash
        run: |
          CANDIDATE_URI="s3://$FRONTEND_BUCKET/_candidates/$RELEASE_SHA/$AUTH_PROVIDER"
          RELEASE_URI="s3://$FRONTEND_BUCKET/_releases/$RELEASE_SHA/$AUTH_PROVIDER"
          aws s3 sync "$CANDIDATE_URI" "$RELEASE_URI"

      - name: Publish the active frontend
        shell: bash
        run: |
          CANDIDATE_URI="s3://$FRONTEND_BUCKET/_candidates/$RELEASE_SHA/$AUTH_PROVIDER"
          aws s3 sync "$CANDIDATE_URI" "s3://$FRONTEND_BUCKET" \
            --delete \
            --exclude "_READY" \
            --exclude "_candidates/*" \
            --exclude "_releases/*"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"

      - name: Record the publication
        shell: bash
        run: |
          {
            echo "### Approved staging frontend published"
            echo ""
            echo "Release SHA: \`$RELEASE_SHA\`"
            echo ""
            echo "Authentication mode: \`$AUTH_PROVIDER\`"
            echo ""
            echo "Approval: ${{ inputs.approval_reference }}"
          } >> "$GITHUB_STEP_SUMMARY"
