name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest, bandit; pylint/mypy informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create local .env for the test container
        run: cp backend/.env.example backend/.env

      - name: Run backend test suite
        run: |
          docker compose -f docker-compose-tests.yml up \
            --build \
            --exit-code-from backend \
            db backend

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/_test_output
          if-no-files-found: ignore

      - name: Stop remaining services
        if: always()
        run: docker compose -f docker-compose-tests.yml down -v

  frontend-checks:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
