name: Validate branch

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "fix/**"
      - "feature/**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend, migrations, and security
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stocks_in_hand_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stocks_in_hand_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stocks_in_hand_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-api.txt
            backend/requirements-testing.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r backend/requirements-api.txt \
            -r backend/requirements-testing.txt \
            pypdf==6.14.2 \
            defusedxml==0.7.1 \
            playwright==1.61.0
      - name: Verify upgrade from the deployed drifted schema
        working-directory: backend
        run: |
          python -c "from sqlalchemy import create_engine, text; import os; engine=create_engine(os.environ['DATABASE_URL'], isolation_level='AUTOCOMMIT'); connection=engine.connect(); connection.execute(text('CREATE ROLE anon NOLOGIN')); connection.execute(text('CREATE ROLE authenticated NOLOGIN')); connection.close(); engine.dispose()"
          alembic upgrade 86d2cognitoidentity
          python -c "from sqlalchemy import create_engine, text; import os; engine=create_engine(os.environ['DATABASE_URL']); connection=engine.connect(); connection.execute(text('ALTER TABLE artifacts DROP COLUMN is_duplicate')); connection.commit(); connection.close(); engine.dispose()"
          alembic upgrade head
      - name: Run backend tests
        run: python -m pytest -q backend/tests
      - name: Run security scan
        run: python -m bandit -q -r backend/app backend/main.py

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test
      - name: Build legacy configuration
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_AUTH_PROVIDER: legacy
        run: npm run build
      - name: Build Cognito configuration
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_AUTH_PROVIDER: cognito
          NEXT_PUBLIC_AWS_REGION: ap-southeast-2
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-southeast-2_example
          NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: exampleclientid
        run: npm run build
