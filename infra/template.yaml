  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub stocks-in-hand-${Environment}-frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendRouteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.indexOf('/api/') === 0 || uri.split('/').pop().includes('.')) {
            return request;
          }

          var route = uri.replace(/\/+$/, '') || '/';
          var staticRoutes = {
            '/': true,
            '/about': true,
            '/announcements': true,
            '/data-sources': true,
            '/search': true,
            '/sign-in': true,
            '/sign-out': true,
            '/sign-up': true,
            '/terms': true,
            '/watchlist': true
          };
          var tickerRoute = /^\/ticker\/(ANZ|BHP|CBA|CSL|WES)(\/(news|deep-dive))?$/;

          if (!staticRoutes[route] && !tickerRoute.test(route)) {
            request.uri = '/404.html';
            request.headers['x-stonks-not-found'] = { value: '1' };
            return request;
          }

          request.uri = route === '/' ? '/index.html' : route + '/index.html';
          return request;
        }
      FunctionConfig:
        Comment: Rewrite static Next.js routes to generated index files.
        Runtime: cloudfront-js-2.0
      Name: !Sub stocks-in-hand-${Environment}-routes

  FrontendResponseFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var response = event.response;
          if (event.request.headers['x-stonks-not-found']) {
            response.statusCode = 404;
            response.statusDescription = 'Not Found';
          }
          return response;
        }
      FunctionConfig:
        Comment: Return a correct 404 status for the exported not-found page.
        Runtime: cloudfront-js-2.0
      Name: !Sub stocks-in-hand-${Environment}-responses

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub Stocks In Hand ${Environment}
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendRouteFunction.FunctionARN
            - EventType: viewer-response
              FunctionARN: !GetAtt FrontendResponseFunction.FunctionARN
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
        CacheBehaviors:
          - AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            PathPattern: /api/*
            TargetOriginId: backend-api
            ViewerProtocolPolicy: https-only
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: frontend-s3
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            DomainName: !Sub >-
              ${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
            Id: backend-api
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub ${FrontendBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

