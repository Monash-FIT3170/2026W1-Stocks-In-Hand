AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Low-cost staging deployment for Stocks In Hand.

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues:
      - staging
  ParameterPathPrefix:
    Type: String
    Default: /stocks-in-hand/staging
    AllowedPattern: ^/[A-Za-z0-9/_.-]+$
  OperationsEmail:
    Type: String
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
  FrontendBaseUrl:
    Type: String
    Default: https://example.invalid
    AllowedPattern: ^https://[^\s/]+/?$
    Description: Existing public frontend origin used in notification links.
  AuthProvider:
    Type: String
    Default: legacy
    AllowedValues:
      - legacy
      - dual
      - cognito
    Description: Selects legacy, short-lived dual cutover, or Cognito authentication.
  ScheduleEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  PublicDiscussionScheduleEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable bounded weekday public discussion collection.
  AnalysisEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Set false to stop Queue C from starting new analysis work.
  NotificationsEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Master switch for user-facing Brevo watchlist alerts.
  AlertSenderEmail:
    Type: String
    Default: ""
    AllowedPattern: ^$|^[^@\s]+@[^@\s]+\.[^@\s]+$
    Description: Sender address verified in the Brevo account.
  AlertDailyBudget:
    Type: String
    Default: "180"
    AllowedPattern: ^[0-9]+$
  AlertMaxPerInvestorPerRun:
    Type: String
    Default: "5"
    AllowedPattern: ^[1-9][0-9]*$
  BedrockEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Grants the API and analysis Lambdas access to the approved Bedrock model.
  ScheduledTickers:
    Type: String
    Default: ANZ,BHP,CBA,CSL,WES
  ScheduledPublicDiscussionSources:
    Type: String
    Default: bluesky,mastodon
    Description: Comma-separated subset of reddit, bluesky, mastodon, and blog.
  PublicDiscussionPerSourceLimit:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 25
  ApiImageUri:
    Type: String
  ScraperImageUri:
    Type: String
  AnalysisImageUri:
    Type: String

Rules:
  AlertSenderRequiredWhenNotificationsEnabled:
    RuleCondition: !Equals [!Ref NotificationsEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref AlertSenderEmail, ""]]
        AssertDescription: AlertSenderEmail is required when notifications are enabled.

Conditions:
  IsScheduleEnabled: !Equals [!Ref ScheduleEnabled, "true"]
  IsPublicDiscussionScheduleEnabled: !Equals [!Ref PublicDiscussionScheduleEnabled, "true"]
  IsAnalysisEnabled: !Equals [!Ref AnalysisEnabled, "true"]
  IsNotificationsEnabled: !Equals [!Ref NotificationsEnabled, "true"]
  IsBedrockEnabled: !Equals [!Ref BedrockEnabled, "true"]

Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub stocks-in-hand-${Environment}-alarms
      Subscription:
        - Endpoint: !Ref OperationsEmail
          Protocol: email

  DiscoveryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub stocks-in-hand-${Environment}-discovery-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  DownloadDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub stocks-in-hand-${Environment}-download-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  AnalysisDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub stocks-in-hand-${Environment}-analysis-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  NotificationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub stocks-in-hand-${Environment}-notification-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  DiscoveryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub stocks-in-hand-${Environment}-discovery
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      VisibilityTimeout: 1800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DiscoveryDeadLetterQueue.Arn
        maxReceiveCount: 5

  DownloadQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub stocks-in-hand-${Environment}-download
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      VisibilityTimeout: 1800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DownloadDeadLetterQueue.Arn
        maxReceiveCount: 5

  AnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub stocks-in-hand-${Environment}-analysis
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      VisibilityTimeout: 4320
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalysisDeadLetterQueue.Arn
        maxReceiveCount: 5

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub stocks-in-hand-${Environment}-notification
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      VisibilityTimeout: 1800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDeadLetterQueue.Arn
        maxReceiveCount: 5

  AnalysisQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AnalysisQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRawBucketNotifications
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AnalysisQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub >-
                  arn:${AWS::Partition}:s3:::stocks-in-hand-${Environment}-${AWS::AccountId}-raw

  RawDocumentBucket:
    Type: AWS::S3::Bucket
    DependsOn: AnalysisQueuePolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub stocks-in-hand-${Environment}-${AWS::AccountId}-raw
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawDocuments
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
            Queue: !GetAtt AnalysisQueue.Arn
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RawDocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawDocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt RawDocumentBucket.Arn
              - !Sub ${RawDocumentBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub stocks-in-hand-${Environment}-${AWS::AccountId}-frontend
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldFrontendVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 14
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # The Cognito foundation was provisioned ahead of the reviewed application
  # cutover. Keep these stable logical IDs in legacy releases so CloudFormation
  # cannot orphan the retained pool or delete its public app client.
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub stocks-in-hand-${Environment}-users
      UserPoolTags:
        Project: StocksInHand
        Environment: !Ref Environment
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      DeletionProtection: ACTIVE
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ClientName: !Sub stocks-in-hand-${Environment}-web
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes:
        - email
        - email_verified
        - name
      WriteAttributes:
        - email
        - name

  ServerlessHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        Authorizers:
          # FastAPI enforces authentication while legacy and Cognito coexist.
          # This authorizer is available for explicit route bindings after the
          # legacy rollback window closes.
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              audience:
                - !Ref CognitoUserPoolClient
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${CognitoUserPool}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub stocks-in-hand-${Environment}-api
      AutoPublishAlias: live
      PackageType: Image
      ImageUri: !Ref ApiImageUri
      ImageConfig:
        Command:
          - lambda_api.handler
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Sub ${ParameterPathPrefix}/database-url
          LLM_PROVIDER: bedrock
          BEDROCK_ENABLED: !Ref BedrockEnabled
          BEDROCK_MODEL_ID: openai.gpt-oss-120b-1:0
          BEDROCK_SERVICE_TIER: default
          BEDROCK_MAX_PROMPT_CHARS: "30000"
          BEDROCK_MAX_OUTPUT_TOKENS: "1024"
          REDDIT_CLIENT_ID_PARAMETER: !Sub ${ParameterPathPrefix}/reddit-client-id
          REDDIT_CLIENT_SECRET_PARAMETER: !Sub ${ParameterPathPrefix}/reddit-client-secret
          PUBLIC_DISCUSSION_FEED_URLS_PARAMETER: !Sub ${ParameterPathPrefix}/public-discussion-feed-urls
          DISCOVERY_QUEUE_URL: !Ref DiscoveryQueue
          ANALYSIS_QUEUE_URL: !Ref AnalysisQueue
          NOTIFICATIONS_ENABLED: !Ref NotificationsEnabled
          ALERT_SENDER_EMAIL: !Ref AlertSenderEmail
          BREVO_API_KEY_PARAMETER: !If
            - IsNotificationsEnabled
            - !Sub ${ParameterPathPrefix}/brevo-api-key
            - ""
          FRONTEND_BASE_URL: !Ref FrontendBaseUrl
          SUPPORTED_TICKERS: ANZ,BHP,CBA,CSL,WES
          SESSION_COOKIE_SECURE: "true"
          SESSION_COOKIE_SAMESITE: lax
          AUTH_PROVIDER: !Ref AuthProvider
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_APP_CLIENT_ID: !Ref CognitoUserPoolClient
          COGNITO_ISSUER: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${CognitoUserPool}
          COGNITO_LINK_EXISTING_BY_EMAIL: "false"
      Policies:
        - Statement:
            - Sid: ReadRuntimeParameters
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub >-
                arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPathPrefix}/*
            - Sid: DecryptSsmParameters
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.${AWS::URLSuffix}
            - Sid: EnqueueDiscovery
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt DiscoveryQueue.Arn
            - Sid: EnqueuePublicDiscussionAnalysis
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AnalysisQueue.Arn
        - !If
          - IsBedrockEnabled
          - Statement:
              - Sid: InvokeApprovedBedrockModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub >-
                  arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/openai.gpt-oss-120b-1:0
          - !Ref AWS::NoValue
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref ServerlessHttpApi
            Method: ANY
            Path: /
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ServerlessHttpApi
            Method: ANY
            Path: /{proxy+}

  DiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub stocks-in-hand-${Environment}-discovery
      AutoPublishAlias: live
      PackageType: Image
      ImageUri: !Ref ScraperImageUri
      ImageConfig:
        Command:
          - lambdas.discovery.handler
      Architectures:
        - x86_64
      MemorySize: 2048
      Timeout: 300
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Sub ${ParameterPathPrefix}/database-url
          DOWNLOAD_QUEUE_URL: !Ref DownloadQueue
          DISCOVERY_LOOKBACK_DAYS: "30"
          MAX_DOCUMENTS_PER_RUN: "3"
      Policies:
        - Statement:
            - Sid: ReadDatabaseParameter
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub >-
                arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPathPrefix}/database-url
            - Sid: DecryptDatabaseParameter
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.${AWS::URLSuffix}
            - Sid: EnqueueDownload
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt DownloadQueue.Arn
      Events:
        DiscoveryMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt DiscoveryQueue.Arn
            BatchSize: 1
            Enabled: true

  DownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub stocks-in-hand-${Environment}-download
      AutoPublishAlias: live
      PackageType: Image
      ImageUri: !Ref ScraperImageUri
      ImageConfig:
        Command:
          - lambdas.download.handler
      Architectures:
        - x86_64
      MemorySize: 2048
      Timeout: 300
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Sub ${ParameterPathPrefix}/database-url
          RAW_DOCUMENT_BUCKET: !Ref RawDocumentBucket
          MAX_DOCUMENT_BYTES: "10485760"
          MAX_DOCX_UNCOMPRESSED_BYTES: "20971520"
      Policies:
        - Statement:
            - Sid: ReadDatabaseParameter
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub >-
                arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPathPrefix}/database-url
            - Sid: DecryptDatabaseParameter
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.${AWS::URLSuffix}
            - Sid: StoreRawDocuments
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${RawDocumentBucket.Arn}/raw/*
      Events:
        DownloadMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt DownloadQueue.Arn
            BatchSize: 1
            Enabled: true
            ScalingConfig:
              MaximumConcurrency: 2

  AnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub stocks-in-hand-${Environment}-analysis
      AutoPublishAlias: live
      PackageType: Image
      ImageUri: !Ref AnalysisImageUri
      ImageConfig:
        Command:
          - lambdas.analysis.handler
      Architectures:
        - x86_64
      MemorySize: 3008
      Timeout: 720
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Sub ${ParameterPathPrefix}/database-url
          RAW_DOCUMENT_BUCKET: !Ref RawDocumentBucket
          MAX_DOCUMENT_BYTES: "10485760"
          MAX_PDF_PAGES: "100"
          MAX_OCR_PAGES: "5"
          MAX_OCR_PIXELS_PER_PAGE: "8000000"
          MAX_ANALYSIS_CHARS: "50000"
          NOTIFICATIONS_ENABLED: !Ref NotificationsEnabled
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
          LLM_PROVIDER: bedrock
          BEDROCK_ENABLED: !Ref BedrockEnabled
          BEDROCK_MODEL_ID: openai.gpt-oss-120b-1:0
          BEDROCK_SERVICE_TIER: flex
          BEDROCK_MAX_PROMPT_CHARS: "30000"
          BEDROCK_MAX_OUTPUT_TOKENS: "1024"
      Policies:
        - Statement:
            - Sid: ReadRuntimeParameters
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub >-
                arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPathPrefix}/*
            - Sid: DecryptRuntimeParameters
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.${AWS::URLSuffix}
            - Sid: ReadRawDocuments
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${RawDocumentBucket.Arn}/raw/*
        - !If
          - IsNotificationsEnabled
          - Statement:
              - Sid: EnqueueNotifications
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt NotificationQueue.Arn
          - !Ref AWS::NoValue
        - !If
          - IsBedrockEnabled
          - Statement:
              - Sid: InvokeApprovedBedrockModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub >-
                  arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/openai.gpt-oss-120b-1:0
          - !Ref AWS::NoValue
      Events:
        AnalysisMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalysisQueue.Arn
            BatchSize: 1
            Enabled: !If [IsAnalysisEnabled, true, false]

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub stocks-in-hand-${Environment}-notification
      AutoPublishAlias: live
      PackageType: Image
      ImageUri: !Ref ApiImageUri
      ImageConfig:
        Command:
          - lambdas.notify.handler
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Sub ${ParameterPathPrefix}/database-url
          NOTIFICATIONS_ENABLED: !Ref NotificationsEnabled
          ALERT_SENDER_EMAIL: !Ref AlertSenderEmail
          BREVO_API_KEY_PARAMETER: !If
            - IsNotificationsEnabled
            - !Sub ${ParameterPathPrefix}/brevo-api-key
            - ""
          ALERT_DAILY_BUDGET: !Ref AlertDailyBudget
          ALERT_MAX_PER_INVESTOR_PER_RUN: !Ref AlertMaxPerInvestorPerRun
          FRONTEND_BASE_URL: !Ref FrontendBaseUrl
      Policies:
        - Statement:
            - Sid: ReadNotificationParameters
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub >-
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPathPrefix}/database-url
                - !Sub >-
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPathPrefix}/brevo-api-key
            - Sid: DecryptNotificationParameters
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.${AWS::URLSuffix}
      Events:
        NotificationMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationQueue.Arn
            BatchSize: 10
            Enabled: !If [IsNotificationsEnabled, true, false]
            FunctionResponseTypes:
              - ReportBatchItemFailures

  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub stocks-in-hand-${Environment}-scheduler
      AutoPublishAlias: live
      PackageType: Image
      ImageUri: !Ref ApiImageUri
      ImageConfig:
        Command:
          - lambdas.schedule.handler
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Sub ${ParameterPathPrefix}/database-url
          DISCOVERY_QUEUE_URL: !Ref DiscoveryQueue
          SCHEDULED_TICKERS: !Ref ScheduledTickers
      Policies:
        - Statement:
            - Sid: ReadDatabaseParameter
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub >-
                arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPathPrefix}/database-url
            - Sid: DecryptDatabaseParameter
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.${AWS::URLSuffix}
            - Sid: EnqueueDiscovery
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt DiscoveryQueue.Arn

  PublicDiscussionSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub stocks-in-hand-${Environment}-public-discussion-scheduler
      AutoPublishAlias: live
      PackageType: Image
      ImageUri: !Ref ApiImageUri
      ImageConfig:
        Command:
          - lambdas.public_discussion_schedule.handler
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 180
      Environment:
        Variables:
          DATABASE_URL_PARAMETER: !Sub ${ParameterPathPrefix}/database-url
          REDDIT_CLIENT_ID_PARAMETER: !Sub ${ParameterPathPrefix}/reddit-client-id
          REDDIT_CLIENT_SECRET_PARAMETER: !Sub ${ParameterPathPrefix}/reddit-client-secret
          PUBLIC_DISCUSSION_FEED_URLS_PARAMETER: !Sub ${ParameterPathPrefix}/public-discussion-feed-urls
          ANALYSIS_QUEUE_URL: !Ref AnalysisQueue
          SCHEDULED_PUBLIC_DISCUSSION_SOURCES: !Ref ScheduledPublicDiscussionSources
          PUBLIC_DISCUSSION_PER_SOURCE_LIMIT: !Ref PublicDiscussionPerSourceLimit
          PUBLIC_DISCUSSION_SEARCH_QUERY: ASX
      Policies:
        - Statement:
            - Sid: ReadRuntimeParameters
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub >-
                arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPathPrefix}/*
            - Sid: DecryptRuntimeParameters
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.${AWS::URLSuffix}
            - Sid: EnqueuePublicDiscussionAnalysis
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AnalysisQueue.Arn

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeStocksInHandScheduler
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt SchedulerFunction.Arn
                  - !GetAtt PublicDiscussionSchedulerFunction.Arn

  WeeklyScrapeSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Bounded weekly discovery run for enabled ASX sources.
      FlexibleTimeWindow:
        Mode: "OFF"
      Name: !Sub stocks-in-hand-${Environment}-weekly
      ScheduleExpression: cron(0 9 ? * MON *)
      ScheduleExpressionTimezone: Australia/Melbourne
      State: !If [IsScheduleEnabled, ENABLED, DISABLED]
      Target:
        Arn: !GetAtt SchedulerFunction.Arn
        Input: '{"source":"weekly"}'
