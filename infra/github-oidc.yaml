AWSTemplateFormatVersion: "2010-09-09"
Description: Minimal GitHub OIDC roles for the Stocks In Hand staging deployment.

Parameters:
  GitHubRepository:
    Type: String
    Default: Monash-FIT3170/2026W1-Stocks-In-Hand
    AllowedPattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
  GitHubEnvironment:
    Type: String
    Default: staging
    AllowedPattern: ^[A-Za-z0-9_.-]+$
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: Required only when the account already has the GitHub OIDC provider.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      ClientIdList:
        - sts.amazonaws.com
      Url: https://token.actions.githubusercontent.com

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stocks-in-hand-cloudformation-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: ManageApplicationLambdaRoles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stocks-in-hand-*"

  GitHubDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stocks-in-hand-github-staging
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub >-
                  repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: DeployStaging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PushApplicationImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/stocks-in-hand-api"
                  - !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/stocks-in-hand-scraper"
                  - !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/stocks-in-hand-analysis"
              - Sid: LoginToEcr
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: DeployApplicationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:UpdateStack
                Resource: "*"
              - Sid: UseCloudFormationExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
              - Sid: PublishStaticFrontend
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub >-
                  arn:${AWS::Partition}:s3:::stocks-in-hand-staging-${AWS::AccountId}-frontend
              - Sid: PublishStaticFrontendObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub >-
                  arn:${AWS::Partition}:s3:::stocks-in-hand-staging-${AWS::AccountId}-frontend/*
              - Sid: InvalidateFrontendCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: "*"

Outputs:
  GitHubDeploymentRoleArn:
    Value: !GetAtt GitHubDeploymentRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
