services:
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: ses,sesv2,sqs
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spike
    volumes:
      - ./backend/postgres-init.sql:/docker-entrypoint-initdb.d/10-supabase-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spike"]
      interval: 5s
      retries: 5

  backend:
    # Contains api key for groq usage
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      target: testing
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/spike
      AWS_REGION: ap-southeast-2
      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL_SES: http://localstack:4566
      NOTIFICATIONS_ENABLED: "true"
      NOTIFICATIONS_DRY_RUN: "false"
      ALERT_SENDER_EMAIL: alerts@example.com
      FRONTEND_BASE_URL: http://frontend:3000
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python -m alembic upgrade head && bash tests.sh"]
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - ./backend/_test_output:/test_output
      # Repository contract tests inspect deployment and packaging files.
      - ./.github:/.github:ro
      - ./backend:/backend:ro
      - ./frontend:/frontend:ro
      - ./infra:/infra:ro
      - ./docker-compose-dev.yml:/docker-compose-dev.yml:ro
      - ./docker-compose-tests.yml:/docker-compose-tests.yml:ro

  frontend:
    build:
      context: ./frontend
      target: testing
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: /api
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]        # override the CMD from the Dockerfile
    depends_on: 
      backend:
        condition: service_started
