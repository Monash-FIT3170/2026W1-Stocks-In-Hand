services:
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: ses,sesv2,sqs
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spike
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/postgres-init.sql:/docker-entrypoint-initdb.d/10-supabase-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spike"]
      interval: 5s
      retries: 5

  backend:
    # Contains api key for groq usage
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      target: production
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/spike
      SEED_TICKERS: ${SEED_TICKERS:-ANZ,CBA,BHP,WES,CSL}
      AWS_REGION: ap-southeast-2
      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL_SES: http://localstack:4566
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      NOTIFICATIONS_DRY_RUN: ${NOTIFICATIONS_DRY_RUN:-false}
      ALERT_SENDER_EMAIL: ${ALERT_SENDER_EMAIL:-alerts@example.com}
      FRONTEND_BASE_URL: http://localhost:3000
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python -m alembic upgrade head && python -m uvicorn main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: "curl localhost:8000/health"
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 10s
    volumes:
      - ./backend/_data:/data
      - ./output:/app/output

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: /api
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]        # override the CMD from the Dockerfile
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
